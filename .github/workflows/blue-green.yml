name: Blue-Green Deployment

# ┌────────────────────────────────────────────────────────────────────────────┐
# │  BLUE  = main branch    → live production  (priyansh19.github.io)          │
# │  GREEN = release branch → new version being built                          │
# │                                                                             │
# │  Flow:                                                                      │
# │   push → release   : validate + smoke-test green                           │
# │   workflow_dispatch : promote-green  — green → blue (with blue backup)     │
# │                       rollback       — restore blue from latest backup      │
# └────────────────────────────────────────────────────────────────────────────┘

on:
  push:
    branches:
      - release          # Auto-validate green on every push to release

  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        default: promote-green
        type: choice
        options:
          - promote-green   # Promote release → main (green becomes production)
          - rollback        # Restore main from the last blue-backup tag

permissions:
  contents: write          # push to main, create tags
  pages: write             # deploy GitHub Pages
  id-token: write          # OIDC token for Pages

concurrency:
  group: blue-green
  cancel-in-progress: false   # never cancel a deployment mid-flight

# ─────────────────────────────────────────────────────────────────────────────
#  JOB 1 · Validate Green  (runs on every push to release)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  validate-green:
    name: "🟢 Validate Green (release)"
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Check required files exist
        run: |
          echo "── Checking required files ──"
          for f in index.html; do
            if [ -f "$f" ]; then
              echo "✓ $f found ($(wc -c < $f) bytes)"
            else
              echo "✗ $f MISSING" && exit 1
            fi
          done

      - name: Validate HTML structure
        run: |
          echo "── Validating index.html structure ──"
          grep -q '<!DOCTYPE html>' index.html  && echo "✓ DOCTYPE declaration"
          grep -q '<html'          index.html  && echo "✓ <html> tag"
          grep -q '<head'         index.html  && echo "✓ <head> section"
          grep -q '<body'         index.html  && echo "✓ <body> section"
          grep -q '</html>'       index.html  && echo "✓ </html> closing tag"

      - name: Check for broken asset references
        run: |
          echo "── Checking for local asset references ──"
          # Warn about any src/href pointing to local paths that won't resolve
          BAD=$(grep -oE '(src|href)="[^"]*"' index.html | grep -v 'http' | grep -v '#' | grep -v 'mailto' | grep -v '^/' || true)
          if [ -n "$BAD" ]; then
            echo "⚠ Potentially relative asset references found:"
            echo "$BAD"
          else
            echo "✓ No broken local asset references"
          fi

      - name: Write job summary
        run: |
          {
            echo "## 🟢 Green Environment — Validation Passed"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| Required files | ✅ |"
            echo "| HTML structure | ✅ |"
            echo "| Asset references | ✅ |"
            echo ""
            echo "**Branch:** \`release\`  "
            echo "**Commit:** \`${{ github.sha }}\`  "
            echo ""
            echo "Ready to promote → run **workflow_dispatch → promote-green** when satisfied."
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
#  JOB 2 · Promote Green → Blue  (manual trigger: promote-green)
# ─────────────────────────────────────────────────────────────────────────────
  promote-green:
    name: "🔵→🟢 Promote Green to Blue (Production)"
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'promote-green'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://priyansh19.github.io

    steps:
      - name: Checkout main (current blue) with full history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "GitHub Actions [Blue-Green]"
          git config user.email "actions@github.com"

      - name: Backup current blue → timestamped tag
        id: backup
        run: |
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          TAG="blue-backup-${TIMESTAMP}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "✓ Blue backed up as tag: $TAG"

      - name: Checkout release (green) into a temp directory
        uses: actions/checkout@v4
        with:
          ref: release
          path: _green_src

      - name: Swap blue content with green
        run: |
          echo "── Removing current blue content ──"
          find . -maxdepth 1 \
            ! -name '.' \
            ! -name '.git' \
            ! -name '_green_src' \
            -exec rm -rf {} +

          echo "── Copying green content into place (excluding .git) ──"
          rsync -a --exclude='.git' _green_src/ .
          rm -rf _green_src

          echo "── Resulting files ──"
          ls -la

      - name: Commit and push promotion to main
        run: |
          git add -A
          git diff --staged --quiet && echo "Nothing changed — already in sync." && exit 0
          git commit -m "deploy(blue-green): promote release→main [$(date -u +%Y-%m-%dT%H:%M:%SZ)]

          Backup tag: ${{ steps.backup.outputs.tag }}
          Release SHA: $(git -C _green_src rev-parse HEAD 2>/dev/null || echo 'n/a')"
          git push origin main

      - name: Write job summary
        run: |
          {
            echo "## 🟢→🔵 Promotion Complete"
            echo ""
            echo "| Step | Detail |"
            echo "|------|--------|"
            echo "| Blue backup tag | \`${{ steps.backup.outputs.tag }}\` |"
            echo "| Promoted from | \`release\` branch |"
            echo "| Deployed to | \`main\` branch |"
            echo "| Live URL | https://priyansh19.github.io |"
            echo ""
            echo "> Rollback anytime: **workflow_dispatch → rollback**"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
#  JOB 3 · Deploy Blue to GitHub Pages  (runs after promote-green)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-blue:
    name: "🚀 Deploy Blue to GitHub Pages"
    needs: promote-green
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'promote-green'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout main (newly promoted blue)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

# ─────────────────────────────────────────────────────────────────────────────
#  JOB 4 · Rollback  (manual trigger: rollback)
# ─────────────────────────────────────────────────────────────────────────────
  rollback:
    name: "⏪ Rollback Blue to Last Backup"
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://priyansh19.github.io

    steps:
      - name: Checkout main with full history and tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name  "GitHub Actions [Blue-Green]"
          git config user.email "actions@github.com"

      - name: Find the latest blue-backup tag
        id: find-backup
        run: |
          git fetch --tags
          LATEST=$(git tag -l "blue-backup-*" | sort -r | head -1)
          if [ -z "$LATEST" ]; then
            echo "::error::No blue-backup-* tag found. Nothing to roll back to."
            exit 1
          fi
          echo "tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "✓ Will restore from: $LATEST"

      - name: Restore main from backup tag
        run: |
          BACKUP_TAG="${{ steps.find-backup.outputs.tag }}"
          BACKUP_SHA=$(git rev-list -n 1 "$BACKUP_TAG")
          echo "── Restoring files from $BACKUP_TAG ($BACKUP_SHA) ──"

          # Checkout all tracked files from the backup commit
          git checkout "$BACKUP_SHA" -- .

          git add -A
          git diff --staged --quiet && echo "Already at backup state." && exit 0
          git commit -m "rollback(blue-green): restore main from $BACKUP_TAG [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"
          git push origin main
          echo "✓ Rollback committed and pushed"

      - name: Write job summary
        run: |
          {
            echo "## ⏪ Rollback Complete"
            echo ""
            echo "| Step | Detail |"
            echo "|------|--------|"
            echo "| Restored from | \`${{ steps.find-backup.outputs.tag }}\` |"
            echo "| Target branch | \`main\` |"
            echo "| Live URL | https://priyansh19.github.io |"
          } >> "$GITHUB_STEP_SUMMARY"

# ─────────────────────────────────────────────────────────────────────────────
#  JOB 5 · Redeploy GitHub Pages after rollback
# ─────────────────────────────────────────────────────────────────────────────
  redeploy-after-rollback:
    name: "🚀 Redeploy GitHub Pages (post-rollback)"
    needs: rollback
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.action == 'rollback'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout rolled-back main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
